name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check bundle.mjs
      - run: node --check worker.js
      - run: gh release create "$GITHUB_REF_NAME" worker.js bundle.mjs --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
