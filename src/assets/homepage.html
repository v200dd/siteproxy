<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SiteProxy · 网页入口</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f5f1;
            --surface: #ffffff;
            --ink: #252d38;
            --muted: #707985;
            --line: #e4e6e8;
            --accent: #4164e8;
            --accent-soft: #eef1ff;
            --shadow: 0 18px 60px -32px rgba(37, 45, 56, .25);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 88% 0%, rgba(65, 100, 232, .07), transparent 46%), var(--bg);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color .2s, color .2s;
        }
        body.dark-mode {
            color-scheme: dark;
            --bg: #141821;
            --surface: #1d2330;
            --ink: #eef1f8;
            --muted: #a2acc0;
            --line: #303849;
            --accent: #91a6ff;
            --accent-soft: #293452;
            --shadow: 0 18px 60px -32px rgba(0, 0, 0, .65);
        }
        button, input { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        svg { display: block; flex-shrink: 0; }
        :focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
        .container { width: min(100% - 64px, 960px); margin: 0 auto; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 34px 0; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 38px; height: 38px; display: grid; place-items: center;
            border-radius: 12px; background: var(--ink); color: var(--bg);
            font-size: 23px; font-weight: 750; letter-spacing: -2px; padding-right: 2px;
        }
        .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.5px; }
        .brand-caption { color: var(--muted); font-size: 11px; letter-spacing: 2px; margin-top: 3px; }
        .theme-toggle {
            display: flex; align-items: center; gap: 8px; padding: 10px 13px;
            border: 1px solid var(--line); border-radius: 100px;
            background: var(--surface); color: var(--muted); font-size: 12px;
            transition: border-color .2s, color .2s;
        }
        .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }
        .sun-icon, .dark-mode .moon-icon { display: none; }
        .dark-mode .sun-icon { display: block; }
        .hero { padding: 64px 0 44px; }
        .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; letter-spacing: 1px; }
        .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
        h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.35; letter-spacing: -2px; font-weight: 650; margin: 20px 0 15px; }
        h1 span { color: var(--accent); }
        .description { font-size: 15px; line-height: 1.8; color: var(--muted); margin: 0; }
        .search-form {
            display: flex; align-items: center; gap: 16px; margin-top: 32px; padding: 9px 9px 9px 21px;
            border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
            box-shadow: var(--shadow); transition: border-color .2s, box-shadow .2s;
        }
        .search-form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
        .search-icon { color: var(--muted); }
        .search-box { width: 100%; min-width: 0; padding: 14px 0; border: 0; outline: none; background: transparent; color: var(--ink); font-size: 16px; }
        .search-box::placeholder { color: var(--muted); opacity: .8; }
        .visit-button {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            flex-shrink: 0; padding: 16px 22px; border: 0; border-radius: 12px;
            background: #4164e8; color: #fff; font-size: 14px; font-weight: 600;
            transition: background .2s, transform .2s;
        }
        .visit-button:hover { background: #3151cd; transform: translateY(-1px); }
        .search-hint { margin: 14px 3px 0; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; line-height: 1.7; }
        kbd { font: inherit; font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; margin-left: 5px; }
        .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
        .section-heading { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
        .section-heading h2 { margin: 0; font-size: 15px; font-weight: 600; }
        .section-number { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, monospace; }
        .section-heading::after { content: ""; flex: 1; height: 1px; background: var(--line); margin-left: 4px; }
        .websites { display: grid; gap: 12px; }
        .website {
            display: flex; align-items: center; gap: 14px; min-height: 87px; padding: 18px;
            background: var(--surface); border: 1px solid var(--line); border-radius: 15px;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }
        .website:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
        .site-icon { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; font-size: 17px; font-weight: 700; }
        .duck { background: #fff0e7; color: #c46b38; }
        .bing { background: #e5f4f1; color: #278575; }
        .ai { background: #eeebff; color: #7860bd; font-size: 14px; }
        .wiki { background: #edf0f5; color: #566275; font-family: Georgia, serif; font-size: 23px; }
        .dark-mode .site-icon { background: var(--accent-soft); color: var(--accent); }
        .site-copy { flex: 1; min-width: 0; }
        .site-name { display: block; font-size: 14px; font-weight: 600; }
        .site-description { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
        .site-arrow { color: var(--muted); font-size: 19px; }
        .privacy-note { display: flex; align-items: flex-start; gap: 8px; margin: 30px 0 48px; color: var(--muted); font-size: 12px; line-height: 1.8; }
        .privacy-note svg { margin-top: 3px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        @media (max-width: 640px) {
            .container { width: calc(100% - 36px); }
            .header { padding: 22px 0; }
            .hero { padding: 35px 0 34px; }
            h1 { letter-spacing: -1px; }
            .description { font-size: 14px; }
            .search-form { gap: 10px; padding-left: 14px; border-radius: 15px; }
            .search-box { font-size: 14px; }
            .visit-button { padding: 16px 15px; gap: 6px; }
            .visit-button .button-label { display: none; }
            .sections { grid-template-columns: 1fr; gap: 26px; }
            .search-hint .keyboard-hint { display: none; }
            .website { min-height: 80px; }
            .privacy-note { margin-bottom: 30px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div class="brand" aria-label="SiteProxy 网页入口">
                <span class="brand-mark" aria-hidden="true">S</span>
                <div><div class="brand-name">SiteProxy</div><div class="brand-caption">YOUR WEB PORTAL</div></div>
            </div>
            <button class="theme-toggle" type="button" aria-label="切换到深色主题" aria-pressed="false">
                <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20.8 13.3A9 9 0 0 1 10.7 3.2 9 9 0 1 0 20.8 13.3Z" /></svg>
                <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
                <span>切换主题</span>
            </button>
        </header>
        <section class="hero" aria-labelledby="page-title">
            <div class="eyebrow">轻量、简洁的网页入口</div>
            <h1 id="page-title">从这里，<span>连接更多。</span></h1>
            <p class="description">输入一个网址，或从下方选择常用网站。<br>把访问的第一步，变得简单一点。</p>
            <form class="search-form">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></svg>
                <label class="sr-only" for="target-url">要访问的网址</label>
                <input id="target-url" type="text" class="search-box" placeholder="输入网址，例如 wikipedia.org" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" required aria-describedby="search-hint" />
                <button class="visit-button" type="submit" aria-label="访问输入的网址"><span class="button-label">访问</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
            </form>
            <div class="search-hint" id="search-hint"><span>支持 HTTP / HTTPS，自动补全协议</span><span class="keyboard-hint">按<kbd>Enter ↵</kbd> 开始访问</span></div>
        </section>
        <div class="sections">
            <section aria-labelledby="search-heading">
                <div class="section-heading"><span class="section-number" aria-hidden="true">01</span><h2 id="search-heading">搜索引擎</h2></div>
                <div class="websites">
                    <a class="website" href="https://duckduckgo.com" target="_blank" rel="noopener noreferrer"><span class="site-icon duck" aria-hidden="true">D</span><span class="site-copy"><span class="site-name">DuckDuckGo</span><span class="site-description">发现你想了解的内容</span></span><span class="site-arrow" aria-hidden="true">↗</span></a>
                    <a class="website" href="https://www.bing.com" target="_blank" rel="noopener noreferrer"><span class="site-icon bing" aria-hidden="true">b</span><span class="site-copy"><span class="site-name">Bing</span><span class="site-description">搜索网页、图片与更多</span></span><span class="site-arrow" aria-hidden="true">↗</span></a>
                </div>
            </section>
            <section aria-labelledby="sites-heading">
                <div class="section-heading"><span class="section-number" aria-hidden="true">02</span><h2 id="sites-heading">常用网站</h2></div>
                <div class="websites">
                    <a class="website" href="https://duckduckgo.com/aichat" target="_blank" rel="noopener noreferrer"><span class="site-icon ai" aria-hidden="true">AI</span><span class="site-copy"><span class="site-name">DuckDuckGo AI Chat</span><span class="site-description">开启对话，探索灵感</span></span><span class="site-arrow" aria-hidden="true">↗</span></a>
                    <a class="website" href="https://zh.wikipedia.org/" target="_blank" rel="noopener noreferrer"><span class="site-icon wiki" aria-hidden="true">W</span><span class="site-copy"><span class="site-name">Wikipedia</span><span class="site-description">自由的百科全书</span></span><span class="site-arrow" aria-hidden="true">↗</span></a>
                </div>
            </section>
        </div>
        <p class="privacy-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="M12 8v5m0 3v1"/></svg>请勿在代理页面输入密码、银行卡等敏感信息。</p>
    </main>
    <script>
        const searchBox = document.querySelector('.search-box');
        const themeToggle = document.querySelector('.theme-toggle');

        function getProxyRoot() {
            const path = window.location.pathname;
            return path.endsWith('/') ? path : path + '/';
        }

        function toProxyUrl(input) {
            const text = String(input).trim();
            if (!text) return input;
            const root = getProxyRoot();
            if (text.startsWith(root)) return text;
            try {
                const target = new URL(/^https?:\/\//i.test(text) ? text : 'https://' + text);
                if (target.protocol !== 'http:' && target.protocol !== 'https:') return input;
                return root + target.protocol.slice(0, -1) + '/' + target.host + target.pathname + target.search + target.hash;
            } catch (error) {
                return input;
            }
        }

        document.querySelectorAll('.website').forEach((link) => {
            const href = link.getAttribute('href');
            if (href) link.setAttribute('href', toProxyUrl(href));
        });

        function setTheme(dark) {
            document.body.classList.toggle('dark-mode', dark);
            themeToggle.setAttribute('aria-pressed', String(dark));
            themeToggle.setAttribute('aria-label', dark ? '切换到浅色主题' : '切换到深色主题');
        }

        try {
            setTheme(localStorage.getItem('theme') === 'dark-mode');
        } catch (error) {
            setTheme(false);
        }

        themeToggle.addEventListener('click', () => {
            const dark = !document.body.classList.contains('dark-mode');
            setTheme(dark);
            try { localStorage.setItem('theme', dark ? 'dark-mode' : 'light-mode'); } catch (error) {}
        });

        document.querySelector('.search-form').addEventListener('submit', (event) => {
            event.preventDefault();
            navigate();
        });

        function navigate() {
            let inputText = searchBox.value.trim();
            if (!inputText) { searchBox.focus(); return; }
            if (!inputText.startsWith('http://') && !inputText.startsWith('https://')) inputText = 'https://' + inputText;
            window.open(toProxyUrl(inputText), '_blank', 'noopener,noreferrer');
        }
    </script>
</body>
</html>
